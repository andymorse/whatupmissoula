# About page — rendered to /about/ and linked from the site footer.
#
# This file is the whole page. Edit it, commit, and the page rebuilds on the
# next `python run.py --rerender` (no fetch, no AI, no tokens).
#
# NOTHING PUBLISHES UNTIL `published: true` BELOW. While it's false the page
# isn't rendered, isn't in the sitemap, and the footer link doesn't appear — so
# a half-written draft can't go live by accident.
#
#   published:   flip to true when you're happy with the copy
#   title:       <h1> on the page
#   tagline:     one line under the title (optional)
#   intro:       opening paragraph (optional)
#   sections:    list of {heading, body}; add or drop as many as you like
#   contact:     optional {label, email} shown at the bottom
#
# Prose fields use YAML block scalars. Keep the `>-` and indent the text under
# it; blank lines inside a block start a new paragraph.

